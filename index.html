<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safran et moteur micro:bit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef2ee;--ink:#14262b;--mute:#5d6f73;--line:#c5d1ce;--acc:#0a6c74;--on:#fff;--stop:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--ink:#e6efee;--mute:#93a8ab;--line:#264047;--acc:#4fc3c9;--on:#06191c;--stop:#ff6b5e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1f;--ink:#e6efee;--mute:#93a8ab;--line:#264047;--acc:#4fc3c9;--on:#06191c;--stop:#ff6b5e;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 16px/1.3 Barlow,system-ui,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
main{height:100%;max-width:480px;margin:0 auto;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:20px;margin:0;font-weight:700}
#st{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#st[data-ok="1"]{color:var(--acc)}
button{font:600 18px Barlow,system-ui,sans-serif;min-height:46px;padding:0 14px;border-radius:10px;border:2px solid var(--acc);background:transparent;color:var(--acc);touch-action:manipulation}
button.p{background:var(--acc);color:var(--on)}
section{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
section.g{flex:1;min-height:0}
h2{font-size:17px;margin:0;display:flex;justify-content:space-between;align-items:baseline}
h2 b{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:42px;accent-color:var(--acc);margin:0}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.row{display:flex;gap:8px}.row button{flex:1}
svg{display:block;margin:0 auto;height:min(11vh,80px);width:auto;color:var(--ink);flex:0 0 auto}
#stop{background:var(--stop);border-color:var(--stop);color:#fff;font-size:22px;min-height:54px}
</style></head><body><main>
<header><h1>Safran et moteur</h1><button id="cx" class="p">Connecter</button></header>
<div id="st" data-ok="0">Non connecté</div>

<section>
<h2>Safran <b id="vb">0°</b></h2>
<svg viewBox="0 0 150 96" aria-hidden="true"><path d="M75 4C102 28 105 62 98 78H52C45 62 48 28 75 4Z" fill="none" stroke="currentColor" stroke-width="2"/><line id="rd" x1="75" y1="78" x2="75" y2="94" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/></svg>
<input id="rb" type="range" min="-45" max="45" step="1" value="0" aria-label="Safran">
<div class="ends"><span>bâbord</span><span>tribord</span></div>
<div class="row"><button id="bm">−1</button><button id="ctr">Centrer</button><button id="bp">+1</button></div>
</section>

<section class="g">
<h2>Moteur <b id="vm">0 %</b></h2>
<input id="rm" type="range" min="0" max="100" step="5" value="0" aria-label="Moteur">
<div class="ends"><span>0 %</span><span>100 % avant</span></div>
<button id="stop">STOP MOTEUR</button>
</section>
<div id="dbg" class="ends"></div>

<script>
const $=i=>document.getElementById(i),enc=new TextEncoder(),dec=new TextDecoder();
const U='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let rx=null,dev=null,q=Promise.resolve(),hb=null,buf='',lastB=0,lastM=0,busy=0,rep=null;
function send(s){if(rx)q=q.then(async()=>{const d=enc.encode(s+'\n');try{await rx.writeValueWithoutResponse(d)}catch(e){await rx.writeValue(d)}$('dbg').textContent='Envoyé : '+s}).catch(e=>{$('dbg').textContent='Erreur envoi : '+e.message})}
function st(t,ok){$('st').textContent=t;$('st').dataset.ok=ok?1:0}
function showB(a){$('vb').textContent=(a>0?'+':'')+a+'°';const r=a*Math.PI/180;$('rd').setAttribute('x2',75+16*Math.sin(r));$('rd').setAttribute('y2',78+16*Math.cos(r))}
function showM(v){$('vm').textContent=v+' %'}
function setB(v){v=Math.max(-45,Math.min(45,v));$('rb').value=v;showB(v);send('R'+v)}
function tel(l){if(l[0]!=='T'||busy)return;const[b,m]=l.slice(1).split(',').map(Number);$('rb').value=b;showB(b);$('rm').value=m;showM(m)}
async function connect(){
 if(!navigator.bluetooth){st('Web Bluetooth absent : utiliser Bluefy',0);return}
 try{
  dev=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'BBC micro:bit'}],optionalServices:[U]});
  dev.addEventListener('gattserverdisconnected',()=>{rx=null;clearInterval(hb);st('Déconnecté',0);$('cx').textContent='Connecter'});
  st('Connexion…',0);
  const s=await(await dev.gatt.connect()).getPrimaryService(U);
  rx=await s.getCharacteristic(RX);const tx=await s.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged',e=>{buf+=dec.decode(e.target.value);let i;while((i=buf.indexOf('\n'))>=0){tel(buf.slice(0,i).trim());buf=buf.slice(i+1)}});
  hb=setInterval(()=>send('P'),500);
  st('Connecté à '+dev.name,1);$('cx').textContent='Déconnecter';
  try{await navigator.wakeLock.request('screen')}catch(e){}
  send('R0');send('M0');
 }catch(e){st('Échec : '+e.message,0)}
}
$('cx').onclick=()=>{if(dev&&dev.gatt.connected){send('X');dev.gatt.disconnect()}else connect()};
$('stop').onclick=()=>{$('rm').value=0;showM(0);send('X')};
$('rb').oninput=e=>{const v=+e.target.value;showB(v);const t=Date.now();if(t-lastB>80){lastB=t;send('R'+v)}};
$('rb').onchange=e=>send('R'+e.target.value);
$('rm').oninput=e=>{const v=+e.target.value;showM(v);const t=Date.now();if(t-lastM>80){lastM=t;send('M'+v)}};
$('rm').onchange=e=>send('M'+e.target.value);
['rb','rm'].forEach(i=>{$(i).addEventListener('pointerdown',()=>busy=1);['pointerup','pointercancel'].forEach(ev=>$(i).addEventListener(ev,()=>setTimeout(()=>busy=0,600)))});
$('ctr').onclick=()=>setB(0);
function hold(id,d){const b=$(id),step=()=>setB(+$('rb').value+d),stop=()=>{clearTimeout(rep);clearInterval(rep)};
 b.addEventListener('pointerdown',e=>{e.preventDefault();busy=1;step();rep=setTimeout(()=>{rep=setInterval(step,120)},400)});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>{stop();setTimeout(()=>busy=0,600)}))}
hold('bm',-1);hold('bp',1);
</script></main></body></html>
